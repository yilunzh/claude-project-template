name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "**.py"
      - "**.js"
      - "**.ts"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.cfg"
      - "**.json"
      - "**.html"
      - "**.css"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this PR for:
            - Code quality and maintainability
            - Potential bugs or logic errors
            - Best practices for Python and GitHub Actions
            - Consistency with existing patterns

            Also check for architectural issues in changed files:
            - Files over 300 lines (suggest splitting)
            - Dead code: functions/classes defined but never called
            - Performance: O(n^2) patterns, repeated collection scans
            - Correctness: string comparisons that should be enums, non-atomic file ops,
              mutable default args, missing error handling on I/O
            - Test gaps: new source files without corresponding test files
            - Import issues: circular imports, imports from deleted modules
            - Unused or undeclared dependencies

            Be concise. Only comment on issues worth fixing.
            Rate architectural findings as Critical/Warning/Info.
